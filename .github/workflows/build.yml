name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build
        run: mvn clean package -B

      - name: Deploy to Cloudflare R2
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets not configured — skipping deploy"
            exit 0
          fi
          R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          GROUP_PATH=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout | tr '.' '/')
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          REPO_BASE="releases/${GROUP_PATH}/${ARTIFACT_ID}"
          REPO_VERSION="${REPO_BASE}/${VERSION}"

          S3="aws s3 cp --endpoint-url ${R2_ENDPOINT} --region auto"

          # ── upload versioned artifacts ──────────────────────────────────────
          $S3 target/${ARTIFACT_ID}-${VERSION}.jar \
              s3://${R2_BUCKET}/${REPO_VERSION}/${ARTIFACT_ID}-${VERSION}.jar

          if [ -f target/${ARTIFACT_ID}-${VERSION}-sources.jar ]; then
            $S3 target/${ARTIFACT_ID}-${VERSION}-sources.jar \
                s3://${R2_BUCKET}/${REPO_VERSION}/${ARTIFACT_ID}-${VERSION}-sources.jar
          fi

          $S3 pom.xml \
              s3://${R2_BUCKET}/${REPO_VERSION}/${ARTIFACT_ID}-${VERSION}.pom

          # ── checksums ───────────────────────────────────────────────────────
          for file in \
              "target/${ARTIFACT_ID}-${VERSION}.jar:${ARTIFACT_ID}-${VERSION}.jar" \
              "pom.xml:${ARTIFACT_ID}-${VERSION}.pom"; do
            src="${file%%:*}"
            name="${file##*:}"
            md5sum  "$src" | awk '{print $1}' > /tmp/${name}.md5
            sha1sum "$src" | awk '{print $1}' > /tmp/${name}.sha1
            $S3 /tmp/${name}.md5  s3://${R2_BUCKET}/${REPO_VERSION}/${name}.md5
            $S3 /tmp/${name}.sha1 s3://${R2_BUCKET}/${REPO_VERSION}/${name}.sha1
          done

          # ── maven-metadata.xml ──────────────────────────────────────────────
          LAST_UPDATED=$(date -u +%Y%m%d%H%M%S)
          cat > /tmp/maven-metadata.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <metadata>
            <groupId>$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)</groupId>
            <artifactId>${ARTIFACT_ID}</artifactId>
            <versioning>
              <release>${VERSION}</release>
              <versions>
                <version>${VERSION}</version>
              </versions>
              <lastUpdated>${LAST_UPDATED}</lastUpdated>
            </versioning>
          </metadata>
          EOF

          $S3 /tmp/maven-metadata.xml \
              s3://${R2_BUCKET}/${REPO_BASE}/maven-metadata.xml

          md5sum  /tmp/maven-metadata.xml | awk '{print $1}' > /tmp/maven-metadata.xml.md5
          sha1sum /tmp/maven-metadata.xml | awk '{print $1}' > /tmp/maven-metadata.xml.sha1
          $S3 /tmp/maven-metadata.xml.md5  s3://${R2_BUCKET}/${REPO_BASE}/maven-metadata.xml.md5
          $S3 /tmp/maven-metadata.xml.sha1 s3://${R2_BUCKET}/${REPO_BASE}/maven-metadata.xml.sha1

          echo "Deployed ${ARTIFACT_ID}-${VERSION} to R2 at ${REPO_VERSION}"
